name: Build & Host Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ELVARIX26-Scanner-v1.0.0.apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release & Upload APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: ELVARIX'26 Scanner Release ${{ github.ref_name }}
          body: |
            ## ELVARIX'26 Event Management & QR Scanner App
            - **Package**: `com.qrscan`
            - **Expo SDK**: 57
            - **Firebase Database**: Configured (`elvarix26`)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
